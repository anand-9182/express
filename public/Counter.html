<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Count:<span id="t1"></span></h1>
    <button onclick="inc()">inc</button>
    <button onclick="dec()">dec</button>
    <script>
        function getCount() {
            fetch(`http://localhost:3600/getCount`)
                .then((res) => res.json())
                .then((data) => {
                    document.getElementById("t1").innerText =(data)
                })
        }
        function inc() {
            fetch(`http://localhost:3600/inc`)
                .then((res) => res.json())
                .then((data) => {
                    document.getElementById("t1").innerText =(data)
                })
        }
        function dec() {
            fetch(`http://localhost:3600/dec`)
                .then((res) => res.json())
                .then((data) => {
                    document.getElementById("t1").innerText=(data)
                })
        }
        getCount();
    </script>
</body>

</html>
