<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- <form onsubmit="submitissue(event)"> -->
        Enter the type of problem <br>
        <input type="text" id="textb1"><br>
        Enter the Remarks <br>
        <textarea type="text" id="textb2"></textarea><br>
        <button onclick="submitissue()">Submit the issue</button>
    <!-- </form> -->
    <script>
        function submitissue() {
            // ev.preventDefault()
            fetch("http://localhost:3600/form",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    textb1:document.getElementById("textb1").value,
                    textb2:document.getElementById("textb2").value
                })
            })
            .then(res=>res.json())
            .then(data=>console.log(data))
         
        }
    </script>
</body>

</html>
