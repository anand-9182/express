<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form onsubmit="submitissue(event)">
        Enter the type of problem <br>
        <input type="text" id="textb1"><br>
        Enter the Remarks <br>
        <textarea type="text" id="textb2"></textarea><br>
        <button type="submit">Submit the issue</button>
    </form>
    <script>
        function submitissue(ev) {
            console.log("textb1 value is :"+document.getElementById("textb1").value)
            console.log("textb2 value is :"+document.getElementById("textb2").value)
            ev.preventDefault()
            fetch("/form",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    textb1:document.getElementById("textb1").value,
                    textb2:document.getElementById("textb2").value
                })
            })
            .then(res=>res.json())
            .then(data=>console.log("res is :"+JSON.stringify(data)))
         
        }
    </script>
</body>

</html>
